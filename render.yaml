services:
  - type: web
    name: stm-backend
    runtime: node
    plan: free
    rootDir: backend
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma migrate deploy && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SIMULATE_SENSOR
        value: "true"
      - key: SIM_INTERVAL_MS
        value: "5000"